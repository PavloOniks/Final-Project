<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Connect | Poltava Predator Fishing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Join the Club</h1>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="tactics.html">Tactics and Gear</a></li>
            <li><a href="seasons.html">Seasonal Log</a></li>
            <li><a href="gallery.html">Video Gallery</a></li>
            <li><a href="contact.html">Join the Club</a></li>
        </ul>
    </nav>
</header>

<div class="container">
    <main>
        <h2>Connect with Fellow Anglers</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="target">Main Target:</label>
                <select id="target" name="target">
                    <option value="pike">Pike</option>
                    <option value="perch">Perch</option>
                </select>
            </div>
            <button type="submit">Submit Membership</button>
        </form>

        <div style="margin-top:25px; display:flex; gap:15px;">
            <figure>
                <img src="pike_release.jpg" alt="Holding a pike carefully before release.">
                <figcaption>Safe release.</figcaption>
            </figure>
            <figure>
                <img src="trophy_perch.jpg" alt="A proud angler displaying a massive trophy perch.">
                <figcaption>Trophy catch.</figcaption>
            </figure>
        </div>
    </main>
</div>

<footer>
    <p>&copy; 2026 Poltava Predator Fishing Journal.</p>
</footer>

</body>
</html>
